# Render Blueprint for the NestJS API (free tier).
# In Render: New → Blueprint → connect this repo. Render reads this file.
# Set DATABASE_URL, REDIS_URL, WEB_ORIGIN, API_ORIGIN in the dashboard (marked sync:false).
services:
  - type: web
    name: jrst-api
    runtime: node
    plan: free
    region: singapore # closest free region to Pakistan
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    # --prod=false so devDeps (nest, prisma, typescript) are available to build.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @jrst/api build
    # Start the compiled server. Migrations are applied out-of-band (locally via
    # `prisma migrate deploy` against Neon) BEFORE each push — do NOT run migrate
    # deploy here: it acquires a Postgres session advisory lock, which Neon's
    # `-pooler` (PgBouncer transaction pooling) can't hold, so it times out (P1002)
    # and the server never boots. main.js lands at dist/src/main.js (the generated
    # Prisma client sits outside src/, so tsc keeps the src/ path in the output).
    startCommand: pnpm --filter @jrst/api exec node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # --- set these in the Render dashboard (Environment) ---
      - key: DATABASE_URL # Neon pooled connection string (?sslmode=require)
        sync: false
      - key: REDIS_URL # Upstash rediss:// URL
        sync: false
      - key: WEB_ORIGIN # your Vercel URL, e.g. https://jrst.vercel.app (comma-separated for multiple)
        sync: false
      - key: API_ORIGIN # this service's URL, e.g. https://jrst-api.onrender.com
        sync: false
      # --- auto-generated secrets ---
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true
